name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  quality:
    name: Validate exact release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      release_sha: ${{ steps.release_source.outputs.sha }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release tag and checked-out commit
        id: release_source
        env:
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag '${RELEASE_TAG}' must equal '${EXPECTED_TAG}'."
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ] || [ "${HEAD_COMMIT}" != "${EVENT_SHA}" ]; then
            echo "Checked-out commit must match both the release tag and the release event SHA."
            exit 1
          fi

          echo "sha=${HEAD_COMMIT}" >> "${GITHUB_OUTPUT}"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: |
          python -m venv "${RUNNER_TEMP}/eikg-typecheck"
          "${RUNNER_TEMP}/eikg-typecheck/bin/python" -m pip install "mypy==2.3.1" "numpy==2.3.5"
          "${RUNNER_TEMP}/eikg-typecheck/bin/python" -m mypy --no-incremental eikg

      - name: Test
        run: python -m pytest

  build:
    name: Build release distributions
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install and smoke-test the wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/eikg-wheel-smoke"
          "${RUNNER_TEMP}/eikg-wheel-smoke/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/eikg-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/eikg-wheel-smoke/bin/python" -c "from eikg import CombinatorialPolynomialNetwork, DeepPolyNetwork, DeepPolyNetworkCV, EIKGPolynomialRegressor, EIKGPolynomialRegressorCV, PolynomialNetwork, PolynomialNetworkCV"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eikgpolynomial/
    permissions:
      id-token: write
    timeout-minutes: 10

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
